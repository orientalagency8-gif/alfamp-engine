name: Build Alfa MP Engine (Windows)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PROGRAM: five
  ROOT: C:\b
  REPO: C:\b\alfamp-engine

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install setuptools

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g yarn

      - name: Configure MSYS2
        shell: pwsh
        run: |
          $msys = "C:\msys64"
          "$msys\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$msys\usr\bin\pacman.exe" -S --noconfirm --needed make diffutils curl

      - uses: microsoft/setup-msbuild@v2
        with: { msbuild-architecture: x64 }

      - name: Enable Windows developer mode for symlinks
        shell: pwsh
        run: |
          # Required so git can create real symlinks during checkout
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -PropertyType DWord -Force | Out-Null
          git config --global core.symlinks true

      - name: Clone our engine (with submodules + symlinks)
        shell: bash
        run: |
          set -e
          mkdir -p /c/b
          cd /c/b
          # Use the ref/sha from the push event so we build exactly what was pushed
          git -c core.symlinks=true clone --branch master \
            https://github.com/${{ github.repository }}.git alfamp-engine
          cd alfamp-engine
          git submodule update --jobs=4 --init --recursive --depth=1
          du -sh .

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            C:\b\alfamp-engine\code\build
            C:\b\alfamp-engine\vendor
          key: alfamp-engine-${{ github.sha }}
          restore-keys: |
            alfamp-engine-

      - name: Fetch LFS via media URL (from upstream — same blobs)
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          set -e
          # Re-create the LFS-pointer files using upstream as source of truth
          # (we deleted them locally to dodge GitHub LFS push rejection)
          declare -A LFS_FILES=(
            ["vendor/libnode/bin/libnode22.dll"]=1
            ["vendor/libnode/bin/libnode22.lib"]=1
            ["vendor/libnode/bin/libnode22.pdb"]=1
            ["vendor/libnode/bin/libnode22.so"]=1
            ["vendor/libnode/bin/libuv.dll"]=1
            ["vendor/libnode/bin/libuv.lib"]=1
            ["vendor/libnode/bin/libuv.pdb"]=1
            ["vendor/libnode/bin/libuv.so"]=1
          )
          for path in "${!LFS_FILES[@]}"; do
            url="https://media.githubusercontent.com/media/citizenfx/fivem/master/${path}"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "${path}" && echo "  ok ${path}" || echo "  FAIL ${path}"
          done
          ls -la vendor/libnode/bin/

      - name: Strip svadhesive reference
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          if [ -f code/components.json ] && grep -q "svadhesive" code/components.json; then
            python3 -c "import json; p='code/components.json'; d=json.load(open(p)); d=[c for c in d if 'svadhesive' not in str(c).lower()]; json.dump(d,open(p,'w'),indent=2)"
            echo "stripped svadhesive"
          else
            echo "no svadhesive ref to strip"
          fi

      - name: Download Chrome / CEF
        shell: pwsh
        working-directory: ${{ env.REPO }}
        run: pwsh ./fxd.ps1 get-chrome

      - name: Prebuild
        shell: cmd
        working-directory: ${{ env.REPO }}
        run: prebuild.cmd

      - name: Generate solution
        shell: pwsh
        working-directory: ${{ env.REPO }}
        run: pwsh ./fxd.ps1 gen -game ${{ env.PROGRAM }}

      - name: Patch Windows SDK target
        shell: pwsh
        working-directory: ${{ env.REPO }}\code\build\${{ env.PROGRAM }}
        run: |
          $sdks = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.0\.' } | Sort-Object Name -Descending
          if ($sdks) {
            $target = $sdks[0].Name
            Write-Host "Using SDK $target"
            Get-ChildItem -Filter "*.vcxproj" -Recurse | ForEach-Object {
              (Get-Content $_.FullName) -replace '<WindowsTargetPlatformVersion>[^<]*</WindowsTargetPlatformVersion>', "<WindowsTargetPlatformVersion>$target</WindowsTargetPlatformVersion>" | Set-Content $_.FullName
            }
          }

      - name: Build (msbuild release x64)
        shell: cmd
        working-directory: ${{ env.REPO }}\code\build\${{ env.PROGRAM }}
        run: msbuild CitizenMP.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: List binaries
        shell: pwsh
        working-directory: ${{ env.REPO }}\code\bin\${{ env.PROGRAM }}\Release
        run: |
          Get-ChildItem -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
          $exes = (Get-ChildItem -Filter "*.exe").Count
          Write-Host "::notice::Built $exes exe files"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfamp-engine-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.REPO }}\code\bin\${{ env.PROGRAM }}\Release\
          retention-days: 30
