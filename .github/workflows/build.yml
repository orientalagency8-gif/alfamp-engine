name: Build Alfa MP Engine (Windows)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PROGRAM: five
  ROOT: C:\b
  REPO: C:\b\alfamp-engine

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install setuptools

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g yarn

      - name: Configure MSYS2
        shell: pwsh
        run: |
          $msys = "C:\msys64"
          "$msys\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$msys\usr\bin\pacman.exe" -S --noconfirm --needed make diffutils curl

      - uses: microsoft/setup-msbuild@v2
        with: { msbuild-architecture: x64 }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Enable Windows developer mode for symlinks
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -PropertyType DWord -Force | Out-Null
          git config --global core.symlinks true

      - name: Clone our engine (with submodules + symlinks)
        shell: bash
        run: |
          set -e
          mkdir -p /c/b
          cd /c/b
          git -c core.symlinks=true clone --branch master \
            https://github.com/${{ github.repository }}.git alfamp-engine
          cd alfamp-engine
          git submodule update --jobs=4 --init --recursive --depth=1
          du -sh .

      - name: Auto-resolve any remaining merge conflict markers
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          set -e
          # Belt-and-suspenders: scan whole tree for any leftover conflict markers
          # from rebrand patch 3-way merge — auto-resolve by keeping THEIRS (rebrand)
          # over OURS (upstream original). If the previous diagutil.rc fix already
          # resolved things, this is a no-op.
          python3 <<'PY'
          import re, pathlib
          fixed = 0
          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file(): continue
              if f.suffix.lower() not in ('.cpp', '.h', '.rc', '.cs', '.lua', '.js', '.ts', '.json', '.xml', '.csproj', '.vcxproj', '.sln', '.txt', '.md'): continue
              try:
                  t = f.read_text(encoding='utf-8', errors='replace')
              except Exception: continue
              if '<<<<<<<' not in t: continue
              # Keep theirs (rebrand) section between ======= and >>>>>>>
              new = re.sub(
                  r'^<<<<<<<.*?\n.*?^=======\n(.*?)^>>>>>>>.*?\n',
                  lambda m: m.group(1),
                  t,
                  flags=re.DOTALL | re.MULTILINE,
              )
              if new != t:
                  f.write_text(new, encoding='utf-8')
                  fixed += 1
                  print(f"  fixed {f}")
          print(f"Total files auto-fixed: {fixed}")
          PY

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            C:\b\alfamp-engine\code\build
            C:\b\alfamp-engine\vendor
          key: alfamp-engine-${{ github.sha }}
          restore-keys: |
            alfamp-engine-

      - name: Fetch LFS via media URL
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          set -e
          declare -A LFS_FILES=(
            ["vendor/libnode/bin/libnode22.dll"]=1
            ["vendor/libnode/bin/libnode22.lib"]=1
            ["vendor/libnode/bin/libnode22.pdb"]=1
            ["vendor/libnode/bin/libnode22.so"]=1
            ["vendor/libnode/bin/libuv.dll"]=1
            ["vendor/libnode/bin/libuv.lib"]=1
            ["vendor/libnode/bin/libuv.pdb"]=1
            ["vendor/libnode/bin/libuv.so"]=1
          )
          for path in "${!LFS_FILES[@]}"; do
            url="https://media.githubusercontent.com/media/citizenfx/fivem/master/${path}"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 "$url" -o "${path}" && echo "  ok ${path}" || echo "  FAIL ${path}"
          done

      - name: Strip svadhesive reference
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          for F in code/components.json data/client/components.json data/launcher/components.json; do
            if [ -f "$F" ] && grep -q "svadhesive" "$F"; then
              python3 -c "import json; p='$F'; d=json.load(open(p)); d=[c for c in d if 'svadhesive' not in str(c).lower()]; json.dump(d,open(p,'w'),indent=2)"
              echo "  stripped svadhesive from $F"
            fi
          done

      - name: Download Chrome / CEF
        shell: pwsh
        working-directory: ${{ env.REPO }}
        run: pwsh ./fxd.ps1 get-chrome

      - name: Prebuild
        shell: cmd
        working-directory: ${{ env.REPO }}
        run: prebuild.cmd

      - name: Generate solution
        shell: pwsh
        working-directory: ${{ env.REPO }}
        run: pwsh ./fxd.ps1 gen -game ${{ env.PROGRAM }}

      - name: Patch Windows SDK target
        shell: pwsh
        working-directory: ${{ env.REPO }}\code\build\${{ env.PROGRAM }}
        run: |
          $sdks = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^10\.0\.' } | Sort-Object Name -Descending
          if ($sdks) {
            $target = $sdks[0].Name
            Write-Host "Using SDK $target"
            Get-ChildItem -Filter "*.vcxproj" -Recurse | ForEach-Object {
              (Get-Content $_.FullName) -replace '<WindowsTargetPlatformVersion>[^<]*</WindowsTargetPlatformVersion>', "<WindowsTargetPlatformVersion>$target</WindowsTargetPlatformVersion>" | Set-Content $_.FullName
            }
          }

      - name: NuGet restore
        shell: cmd
        working-directory: ${{ env.REPO }}\code\build\${{ env.PROGRAM }}
        run: nuget restore CitizenMP.sln

      - name: Build (msbuild release x64)
        shell: cmd
        working-directory: ${{ env.REPO }}\code\build\${{ env.PROGRAM }}
        run: msbuild CitizenMP.sln /p:Configuration=Release /p:Platform=x64 /m /restore

      - name: Build CFX UI (data.zip + data_big.zip)
        shell: pwsh
        working-directory: ${{ env.REPO }}\ext\cfx-ui
        continue-on-error: true
        run: |
          # CFX UI is Angular. Install deps + build.
          # If it fails, we'll ship a minimal stub data.zip.
          if (Test-Path package.json) {
            yarn install --frozen-lockfile --network-timeout 100000
            yarn build:prod
            # Move output to ext/ui-build/data.zip
            if (Test-Path "${{ env.REPO }}\ext\ui-build\build.cmd") {
              & "${{ env.REPO }}\ext\ui-build\build.cmd"
            }
          }

      - name: Ensure data.zip + data_big.zip exist (stubs if UI build failed)
        shell: pwsh
        working-directory: ${{ env.REPO }}\ext\ui-build
        run: |
          # Pack-client requires these. If real ones aren't built, create minimal stubs
          # so pack-client doesn't fail. The launcher's own UI won't show but server
          # connection still works.
          if (!(Test-Path data.zip)) {
            New-Item -ItemType Directory -Force stub-ui | Out-Null
            "<!DOCTYPE html><html><body><h1>Alfa MP</h1></body></html>" | Out-File -Encoding utf8 stub-ui\index.html
            Compress-Archive -Path stub-ui\* -DestinationPath data.zip -Force
            Write-Host "::warning::Using STUB data.zip (yarn UI build failed)"
          }
          if (!(Test-Path data_big.zip)) {
            Copy-Item data.zip data_big.zip
            Write-Host "::warning::Using STUB data_big.zip"
          }
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Create stub RGL-ElevationHelper.exe (closed-source piece)
        shell: pwsh
        working-directory: ${{ env.REPO }}\code\bin\${{ env.PROGRAM }}\Release
        run: |
          # RGL-ElevationHelper is from CFX's closed-source package and we don't have it.
          # Create a no-op stub so pack-client's Copy-Item succeeds. The stub does nothing —
          # CFX will skip elevation features but the rest of the launcher should still work.
          if (!(Test-Path RGL-ElevationHelper.exe)) {
            # Use a tiny known-valid PE binary — copy the diag exe and rename
            if (Test-Path FiveM_Diag.exe)   { Copy-Item FiveM_Diag.exe RGL-ElevationHelper.exe }
            elseif (Test-Path AlfaMP_Diag.exe) { Copy-Item AlfaMP_Diag.exe RGL-ElevationHelper.exe }
            elseif (Test-Path FiveM.exe)    { Copy-Item FiveM.exe RGL-ElevationHelper.exe }
            else { Write-Host "::warning::no exe to copy for RGL-ElevationHelper stub" }
          }

      - name: Pack client (full distribution)
        shell: pwsh
        working-directory: ${{ env.REPO }}
        run: |
          $packRoot = "C:\b\packed-client"
          New-Item -ItemType Directory -Force $packRoot | Out-Null
          New-Item -ItemType Directory -Force "$packRoot\bin\cef\locales" | Out-Null
          New-Item -ItemType Directory -Force "$packRoot\citizen" | Out-Null

          $bin = "${{ env.REPO }}\code\bin\${{ env.PROGRAM }}\Release"
          $proj = "${{ env.REPO }}"

          # CEF
          Copy-Item -Force -Recurse "$proj\vendor\cef\Release\*.dll"               "$packRoot\bin\"            -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$proj\vendor\cef\Release\*.bin"               "$packRoot\bin\"            -ErrorAction SilentlyContinue
          Copy-Item -Force          "$proj\vendor\cef\Resources\icudtl.dat"        "$packRoot\bin\"            -ErrorAction SilentlyContinue
          Copy-Item -Force          "$proj\vendor\cef\Resources\*.pak"             "$packRoot\bin\cef\"        -ErrorAction SilentlyContinue
          Copy-Item -Force          "$proj\vendor\cef\Resources\locales\en-US.pak" "$packRoot\bin\cef\locales\" -ErrorAction SilentlyContinue

          # data/shared/*, data/client/*, data/redist/crt/* → bin/
          Copy-Item -Force -Recurse "$proj\data\shared\*"     "$packRoot\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$proj\data\client\*"     "$packRoot\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$proj\data\redist\crt\*" "$packRoot\bin\" -ErrorAction SilentlyContinue

          # Build output
          Copy-Item -Force -Recurse "$bin\*.dll"                       "$packRoot\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$bin\*.com"                       "$packRoot\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$bin\CitizenFX_SubProcess_*.bin"  "$packRoot\" -ErrorAction SilentlyContinue
          Copy-Item -Force -Recurse "$bin\citizen\*"                   "$packRoot\citizen\" -ErrorAction SilentlyContinue

          # Main exe (renamed)
          if (Test-Path "$bin\FiveM.exe")      { Copy-Item -Force "$bin\FiveM.exe"      "$packRoot\AlfaMP.exe" }
          if (Test-Path "$bin\AlfaMP.exe")     { Copy-Item -Force "$bin\AlfaMP.exe"     "$packRoot\AlfaMP.exe" }
          if (Test-Path "$bin\FiveM_Diag.exe") { Copy-Item -Force "$bin\FiveM_Diag.exe" "$packRoot\AlfaMP_Diag.exe" }
          if (Test-Path "$bin\AlfaMP_Diag.exe"){ Copy-Item -Force "$bin\AlfaMP_Diag.exe" "$packRoot\AlfaMP_Diag.exe" }
          if (Test-Path "$bin\RGL-ElevationHelper.exe") { Copy-Item -Force "$bin\RGL-ElevationHelper.exe" "$packRoot\" }

          # UI assets
          Copy-Item -Force "$proj\ext\ui-build\data.zip"     "$packRoot\citizen\ui.zip"     -ErrorAction SilentlyContinue
          Copy-Item -Force "$proj\ext\ui-build\data_big.zip" "$packRoot\citizen\ui-big.zip" -ErrorAction SilentlyContinue

          # Version markers
          "${{ github.sha }}".Substring(0,8) | Out-File -Encoding ascii "$packRoot\citizen\release.txt"
          "${{ github.run_number }}"          | Out-File -Encoding ascii "$packRoot\citizen\version.txt"
          "alfamp-engine-v1.0-build${{ github.run_number }}" | Out-File -Encoding ascii "$packRoot\version.txt"

          Write-Host "::group::Packed contents (root)"
          Get-ChildItem $packRoot -File | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "::endgroup::"

          $totalMB = [math]::Round((Get-ChildItem $packRoot -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "::notice::Total packed size: ${totalMB} MB"

      - name: Sanity check the packed client
        shell: pwsh
        working-directory: C:\b\packed-client
        run: |
          $required = @('AlfaMP.exe', 'components.json', 'bin\libcef.dll', 'citizen\version.txt')
          $missing = @()
          foreach ($r in $required) {
            if (!(Test-Path $r)) { $missing += $r }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::PACKED BUNDLE MISSING REQUIRED FILES: $($missing -join ', ')"
            exit 1
          } else {
            Write-Host "::notice::Bundle sanity check PASSED — all required files present"
          }
          Write-Host
          Get-ChildItem -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Upload PACKED artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfamp-engine-packed-${{ github.run_number }}-${{ github.sha }}
          path: C:\b\packed-client\
          retention-days: 30
